name: OpenCode tester test (issue-238-tester-concise)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/opencode-test-238-tester.yml"

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  tester-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.BACLUC_AGENT_GITHUB_TOKEN }}
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      OPENCODE_GO_2_API_KEY: ${{ secrets.OPENCODE_GO_2_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENCODE_AUTH_CONTENT: ${{ secrets.OPENCODE_AUTH_JSON }}
      ISSUE_REPOSITORY: ${{ vars.ISSUE_REPOSITORY || github.repository }}
      MODEL_AVAILABILITY_CACHE_ISSUE: ${{ vars.MODEL_AVAILABILITY_CACHE_ISSUE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.BACLUC_AGENT_GITHUB_TOKEN }}

      - name: Set up OpenCode (issue-238-tester-concise branch)
        uses: ./.github/actions/setup-opencode
        with:
          source-branch: issue-238-tester-concise

      - name: Check model availability
        id: model-availability
        timeout-minutes: 10
        uses: ./.github/actions/model-availability

      - name: Run coordinator-tester proof
        id: tester-proof
        timeout-minutes: 20
        shell: bash
        env:
          AVAILABLE_MODELS: ${{ steps.model-availability.outputs.available-models }}
        run: |
          set -Eeuo pipefail
          printf 'Using source branch: issue-238-tester-concise\n'
          printf 'Using agent description from provision-machines branch: issue-238-tester-concise\n'
          printf 'Agent file: deploys/development_tools/ai_agent_devcontainer/files/opencode/agents/tester.md\n'
          printf 'This workflow validates the concise tester prompt from BacLuc/provision-machines#198.\n'
          PREFERRED_MODEL="opencode/muse-spark-1.3-contributor-free"
          if printf '%s\n' "$AVAILABLE_MODELS" | grep -Fxq "$PREFERRED_MODEL"; then
            MODEL="$PREFERRED_MODEL"
          else
            MODEL="$(printf '%s\n' "$AVAILABLE_MODELS" | head -n 1)"
          fi
          printf 'Using model: %s\n' "$MODEL"
          timeout 20m opencode run --agent coordinator --model "$MODEL" --title "tester-proof-238" "Delegate to the tester subagent (subagent_type=\"tester\"): run the repo fast self-check and return tester output." 2>&1 | tee "$RUNNER_TEMP/tester-proof.out"
