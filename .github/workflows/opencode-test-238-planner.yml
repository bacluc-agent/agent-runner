name: OpenCode planner test (issue-238-planner-concise)

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  planner-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.BACLUC_AGENT_GITHUB_TOKEN }}
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      OPENCODE_GO_2_API_KEY: ${{ secrets.OPENCODE_GO_2_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENCODE_AUTH_CONTENT: ${{ secrets.OPENCODE_AUTH_JSON }}
      ISSUE_REPOSITORY: ${{ vars.ISSUE_REPOSITORY || github.repository }}
      MODEL_AVAILABILITY_CACHE_ISSUE: ${{ vars.MODEL_AVAILABILITY_CACHE_ISSUE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.BACLUC_AGENT_GITHUB_TOKEN }}

      - name: Set up OpenCode (issue-238-planner-concise branch)
        uses: ./.github/actions/setup-opencode
        with:
          source-branch: issue-238-planner-concise

      - name: Check model availability
        id: model-availability
        timeout-minutes: 10
        uses: ./.github/actions/model-availability

      - name: Run coordinator-planner proof
        id: planner-proof
        timeout-minutes: 20
        shell: bash
        env:
          AVAILABLE_MODELS: ${{ steps.model-availability.outputs.available-models }}
        run: |
          set -Eeuo pipefail
          printf 'Using agent description from provision-machines branch: issue-238-planner-concise\n'
          printf 'Agent file: deploys/development_tools/ai_agent_devcontainer/files/opencode/agents/planner.md\n'
          printf 'This workflow validates the concise planner prompt from BacLuc/provision-machines#194.\n'
          timeout 20m opencode run --agent coordinator --title "planner-proof-238" "Use the planner subagent to produce a 5-line test plan for: add a hello-world unit test. Return the planner output." 2>&1 | tee "$RUNNER_TEMP/planner-proof.out"
