name: Refresh ChatGPT auth

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BACLUC_AGENT_GITHUB_TOKEN: ${{ secrets.BACLUC_AGENT_GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.BACLUC_AGENT_GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Refresh auth and update secret
        env:
          CHATGPT_EMAIL: ${{ secrets.CHATGPT_EMAIL || secrets.OPENAI_USERNAME }}
          CHATGPT_PASSWORD: ${{ secrets.CHATGPT_PASSWORD || secrets.OPENAI_PASSWORD }}
          CHATGPT_2FA_KEY: ${{ secrets.CHATGPT_2FA_KEY || secrets.OPENAI_2FA_KEY }}
          OPENAI_USERNAME: ${{ secrets.OPENAI_USERNAME }}
          OPENAI_PASSWORD: ${{ secrets.OPENAI_PASSWORD }}
          OPENAI_2FA_KEY: ${{ secrets.OPENAI_2FA_KEY }}
          CHATGPT_TOTP_KEY: ${{ secrets.CHATGPT_TOTP_KEY }}
        run: |
          set -Eeuo pipefail
          set +e
          xvfb-run -a uv run scripts/chatgpt-login.py > "$RUNNER_TEMP/auth.json" 2> "$RUNNER_TEMP/chatgpt-login.stderr"
          status=$?
          set -e
          if (( status != 0 )); then
            cat "$RUNNER_TEMP/auth.json" >&2
            cat "$RUNNER_TEMP/chatgpt-login.stderr" >&2
            exit "$status"
          fi
          auth_json=$(cat "$RUNNER_TEMP/auth.json")
          [[ -n "${auth_json:-}" ]] && printf '::add-mask::%s\n' "$auth_json"
          printf '%s\n' "$auth_json" | jq -e '.openai.type == "oauth" and .openai.access != "" and .openai.refresh != "" and (.openai.expires | type == "number")' >/dev/null
          GH_TOKEN="$BACLUC_AGENT_GITHUB_TOKEN" gh secret set OPENCODE_AUTH_JSON --repo "$GITHUB_REPOSITORY" --body "$auth_json"
          printf 'Auth refreshed successfully\n'
