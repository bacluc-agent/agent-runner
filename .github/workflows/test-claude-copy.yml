name: Test claude copy
on:
  push:
    branches: [issue-10]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  claude-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Present path copies file
        run: |
          set -Eeuo pipefail
          src="$RUNNER_TEMP/present-src"
          fake_home="$RUNNER_TEMP/present-home"
          path="deploys/development_tools/ai_agent_devcontainer/files/claude/settings.json"
          mkdir -p "$src/$(dirname "$path")"
          printf '{"hooks":{"Stop":[{"hooks":[{"type":"command","command":"./scripts/completion-check"}]}]}}' > "$src/$path"
          if [[ -f "$src/$path" ]]; then
            mkdir -p "$fake_home/.claude"
            cp "$src/$path" "$fake_home/.claude/settings.json"
          else
            echo "::warning::Claude settings not found at $path; continuing without it"
          fi
          jq -e '.hooks.Stop[0].hooks[0].command == "./scripts/completion-check"' "$fake_home/.claude/settings.json"
      - name: Missing path warns and continues
        run: |
          set -Eeuo pipefail
          src="$RUNNER_TEMP/missing-src"
          fake_home="$RUNNER_TEMP/missing-home"
          path="deploys/development_tools/ai_agent_devcontainer/files/claude/settings.json"
          mkdir -p "$src"
          if [[ -f "$src/$path" ]]; then
            mkdir -p "$fake_home/.claude"
            cp "$src/$path" "$fake_home/.claude/settings.json"
          else
            echo "::warning::Claude settings not found at $path; continuing without it"
          fi
          test ! -f "$fake_home/.claude/settings.json"
      - name: Newest provision tag state
        run: |
          set -Eeuo pipefail
          path="deploys/development_tools/ai_agent_devcontainer/files/claude/settings.json"
          mapfile -t tags < <(git ls-remote --tags https://github.com/bacluc/provision-machines.git | awk '$2 !~ /\^\{\}$/ { sub("refs/tags/", "", $2); print $2 }' | grep -E '^[vV]?[0-9]+([.][0-9]+){1,2}([-.][0-9A-Za-z.-]+)?$' | sort -V)
          tag="${tags[${#tags[@]}-1]}"
          printf 'Newest provision tag: %s\n' "$tag"
          git clone --quiet --branch "$tag" https://github.com/bacluc/provision-machines.git "$RUNNER_TEMP/provision-tag"
          if [[ -f "$RUNNER_TEMP/provision-tag/$path" ]] && jq -e '.hooks.Stop[0].hooks[0].command == "./scripts/completion-check"' "$RUNNER_TEMP/provision-tag/$path" > /dev/null; then
            printf 'Stop hook present at tag %s\n' "$tag"
          else
            echo "::warning::Claude settings not found at $path for tag $tag; continuing without it"
          fi
