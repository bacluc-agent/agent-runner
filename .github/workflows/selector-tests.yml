name: Selector tests

# AGENTS.md:17 forbids linking the automatic CI run (ci.yml) as evidence, because its
# result is already in commit status. ci.yml is a completion gate; this is the
# additional test for the paths ci.yml cannot evidence. Those paths - the last-resort
# degradation, the discovery deny-guard, the hardcoded 124 limits and the
# refine-issues.yml selector - cannot be reached by dispatching any workflow, so the
# tests below execute those blocks straight out of the workflow YAML under bash.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selector-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        run: pip install --quiet uv

      - name: Run the selector, 124 and tail tests
        run: >-
          uv run --group dev pytest -v
          .github/actions/model-availability/test_model_availability.py
          -k "TestWorkflowLastResortModel or TestTimeoutAnnotationSeverity or TestHourlySelectionTail or test_last_resort_runs_through_the_provider_key_guards or test_a_deny_listed_pick_is_announced_on_stderr"
