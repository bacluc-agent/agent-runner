name: Hourly issue runner

on:
  schedule:
    - cron: "37 */4 * * *"
  workflow_dispatch:
    inputs:
      selection_prompt:
        description: Optional override for the selection instruction tail (the candidate list is always prepended)
        required: false
        type: string
      selection_timeout_minutes:
        description: Issue selector timeout in minutes
        required: false
        type: number
        default: 10
  push:
    paths:
      - ".github/workflows/hourly-issue.yml"
      - ".github/workflows/opencode.yml"
      - ".github/actions/**"
      - ".opencode/**"
      - "scripts/**"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  select:
    # ponytail: the release step does not run if the job is killed at timeout-minutes, so the
    # claim leaks and the issue stays out of selection until a human unlabels it. Upgrade path:
    # timeout-based claims — encode the run id in the claim (agent-running:<run_id>) and treat a
    # claim whose run is no longer in-progress as expired at selection time.
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 120
    outputs:
      prompt: ${{ steps.pick.outputs.prompt }}
      issue_number: ${{ steps.pick.outputs.issue_number }}
    env:
      GITHUB_TOKEN: ${{ secrets.BACLUC_AGENT_GITHUB_TOKEN }}
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      OPENCODE_GO_2_API_KEY: ${{ secrets.OPENCODE_GO_2_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      OPENCODE_AUTH_CONTENT: ${{ secrets.OPENCODE_AUTH_JSON }}
      ISSUE_REPOSITORY: ${{ vars.ISSUE_REPOSITORY || github.repository }}
      MODEL_AVAILABILITY_CACHE_ISSUE: ${{ vars.MODEL_AVAILABILITY_CACHE_ISSUE }}
      GITHUB_FORK_INVITE_USER: ${{ vars.FORK_INVITE_USER || secrets.FORK_INVITE_USER }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.BACLUC_AGENT_GITHUB_TOKEN }}

      - name: Set up OpenCode
        uses: ./.github/actions/setup-opencode

      - name: Check model availability
        id: model-availability
        uses: ./.github/actions/model-availability

      - name: Dump model probe debug output
        if: always()
        shell: bash
        run: |
          stop_token="$(openssl rand -hex 32)"
          : "${stop_token:?stop-commands fence token generation failed}"
          printf '::stop-commands::%s\n' "$stop_token"
          cat "$RUNNER_TEMP"/model-probes/*.log 2>/dev/null || true
          printf '::%s::\n' "$stop_token"

      - name: Pick issue and dispatch
        id: pick
        shell: bash
        env:
          SELECTION_PROMPT: ${{ inputs.selection_prompt }}
          AVAILABLE_MODELS: ${{ steps.model-availability.outputs.available-models }}
          OPENCODE_FATAL_STAGE: selection
          SELECTION_TIMEOUT_MINUTES: ${{ inputs.selection_timeout_minutes || 10 }}
        run: |
          set -Eeuo pipefail
          rm -f "$RUNNER_TEMP/opencode-fatal.json"

          printf '::add-mask::%s\n' "$GITHUB_TOKEN"
          printf '::add-mask::%s\n' "$OPENCODE_GO_API_KEY"
          printf '::add-mask::%s\n' "$OPENCODE_GO_2_API_KEY"
          printf '::add-mask::%s\n' "$OPENCODE_AUTH_CONTENT"

          if ! quota="$(gh api rate_limit --jq '"\(.resources.core.remaining) \(.resources.core.reset) \(.resources.graphql.remaining) \(.resources.graphql.reset)"' 2>/dev/null)"; then
            printf '::warning::rate_limit probe failed; continuing and letting real errors surface\n' >&2
          else
            read -r core_remaining core_reset graphql_remaining graphql_reset <<< "$quota"
            if [[ "$core_remaining" == "0" ]]; then
              printf '::error::GitHub API core quota exhausted; resets at %s (%s). Standing down this run.\n' "$core_reset" "$(date -u -d "@$core_reset" '+%Y-%m-%d %H:%M:%S UTC' 2>/dev/null || date -u -r "$core_reset" '+%Y-%m-%d %H:%M:%S UTC' 2>/dev/null || echo 'unknown')"
              exit 0
            fi
            if [[ "$graphql_remaining" == "0" ]]; then
              printf '::error::GitHub API graphql quota exhausted; resets at %s (%s). Standing down this run.\n' "$graphql_reset" "$(date -u -d "@$graphql_reset" '+%Y-%m-%d %H:%M:%S UTC' 2>/dev/null || date -u -r "$graphql_reset" '+%Y-%m-%d %H:%M:%S UTC' 2>/dev/null || echo 'unknown')"
              exit 0
            fi
          fi

          if ! gh label create agent-running -R "$ISSUE_REPOSITORY" \
            --color 0E8A16 --description 'Selected by the hourly issue runner' --force; then
            printf '::warning::could not ensure the agent-running label exists; the claim may not apply\n'
          fi
          if ! gh label create agent-attempted -R "$ISSUE_REPOSITORY" \
            --color 1D76DB --description 'Already attempted by the hourly issue runner' --force; then
            printf '::warning::could not ensure the agent-attempted label exists; attempt history may not apply\n'
          fi

          printf '\n\n\n\n\n\n'
          printf 'Fetching github issues...\n'
          printf '\n\n\n\n\n\n'

          search_json="$RUNNER_TEMP/candidates.json"
          if ! gh api "repos/${ISSUE_REPOSITORY}/issues?state=open&labels=ready-for-implementation&sort=created&direction=asc&per_page=100" \
            --jq 'map(select(.pull_request == null)) | map(select(.labels | map(.name) | index("agent-running") == null)) | .[0:50]' > "$search_json"; then
            printf '::error::could not list candidate issues; failing this run.\n' >&2
            exit 1
          fi

          candidates="$RUNNER_TEMP/candidate-numbers.txt"
          jq -r '.[].number | tostring' "$search_json" > "$candidates"
          if [[ ! -s "$candidates" ]]; then
            printf '%s\n' 'No unclaimed open issues; nothing to do.'
            exit 0
          fi
          printf 'Unclaimed candidate issues (oldest first):\n'
          cat "$candidates"
          printf '\n\n\n\n\n\n'
          printf 'Selecting model...\n'
          printf '\n\n\n\n\n\n'

          available_models_file="$RUNNER_TEMP/available-models.txt"
          printf '%s\n' "$AVAILABLE_MODELS" > "$available_models_file"

          selection_model=''
          selection_source=''
          # Exclude known-weak free models per scripts/model-deny-list.txt (shared with
          # opencode.yml and refine-issues.yml); they pass the trivial OK probe but
          # fail as coordinator/selector in 10+ runs (e.g. 34029380869, 34042660858).
          mapfile -t free_models < <(grep -E '^(opencode|openrouter)/[^[:space:]]+(-free|:free)$' "$available_models_file" | grep -Ev -f scripts/model-deny-list.txt | awk '!seen[$0]++')
          for candidate in \
            'opencode-go-openai/qwen3.8-flash' \
            'opencode-go-openai-2/qwen3.8-flash' \
            'opencode/big-pickle' \
            "${free_models[@]}"; do
            case "$candidate" in
              opencode-go-openai/qwen3.8-flash)
                grep -Fxq "$candidate" "$available_models_file" && [[ -n "$OPENCODE_GO_API_KEY" ]] || continue
                ;;
              opencode-go-openai-2/qwen3.8-flash)
                grep -Fxq "$candidate" "$available_models_file" && [[ -n "$OPENCODE_GO_2_API_KEY" ]] || continue
                ;;
              opencode/big-pickle)
                grep -Fxq "$candidate" "$available_models_file" || continue
                ;;
              opencode/*-free) ;;
              openrouter/*)
                [[ -n "$OPENROUTER_API_KEY" ]] || continue
                ;;
              *) continue ;;
            esac
            selection_model="$candidate"
            selection_source='preferred list'
            break
          done
          if [[ -z "$selection_model" ]]; then
            selection_model="$(grep -Ev -f scripts/model-deny-list.txt "$available_models_file" | head -n1 || true)"
            selection_source='last resort (deny-list filtered)'
            if [[ -z "$selection_model" ]]; then
              printf '%s\n' 'No issue-selection model is available; not dispatching.' >&2
              exit 1
            fi
            printf '%s\n' "Using fallback model: $selection_model" >&2
          fi
          printf 'Issue selection model: %s (source: %s)\n' "$selection_model" "$selection_source"
          echo "selection_model=${selection_model}" >> "$GITHUB_OUTPUT"
          export MODEL="$selection_model"
          printf '\n\n\n\n\n\n'
          printf 'Choosing issue...\n'
          printf '\n\n\n\n\n\n'

          default_tail="$(cat scripts/issue-selection-tail.txt)"
          tail_instruction="${SELECTION_PROMPT:-$default_tail}"

          enriched="$RUNNER_TEMP/candidates.enriched.json"
          cp "$search_json" "$enriched"
          gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --paginate --jq '.[].name' > "$RUNNER_TEMP/branches.txt"
          : > "$RUNNER_TEMP/enrichment.jsonl"

          # Repos to check for open agent PRs: the known agent repos plus any repos
          # referenced in candidate issue bodies (e.g. upstream ecamp/ecamp3).
          # Extracted mentions are matched against PR headRefNames below; the gh pr list … || true calls tolerate nonexistent repos — no existence probe (one gh call per mention saved).
          repo_list=("$GITHUB_REPOSITORY" "$ISSUE_REPOSITORY" bacluc/provision-machines bacluc-agent/ecamp3)
          # ponytail: frequency order, not alphabetical, so the 20-repo cap below keeps
          # real repos; a repo mentioned <5x can still be dropped (issue-269 loses
          # bacluc-agent/renovate) — upgrade path: one batched existence call.
          mapfile -t body_repos < <(jq -r '.[].body // ""' "$search_json" \
            | sed 's|https\?://[^/]*/||g; s|git@[^:]*:||g; s|github\.com/||g; s|\.git\b||g' \
            | grep -oE '[A-Za-z0-9][A-Za-z0-9-]{2,}/[A-Za-z0-9][A-Za-z0-9_.-]{1,}' \
            | grep -vE '^(github|www|http|https)\.com$' \
            | sort | uniq -c | sort -rn | awk '{print $2}')
          for repo in "${body_repos[@]}"; do
            case " ${repo_list[*]} " in
              *" $repo "*) ;;
              *) repo_list+=("$repo") ;;
            esac
          done
          if (( ${#repo_list[@]} > 20 )); then
            repo_list=("${repo_list[@]:0:20}")
          fi

          pr_lookup_dir="$RUNNER_TEMP/pr-lookup"
          mkdir -p "$pr_lookup_dir"
          for repo in "${repo_list[@]}"; do
            key="$(echo "$repo" | tr '/' '_')"
            # REST list on the core bucket: `gh pr list` uses GraphQL. REST reports a
            # merged PR as `closed`, so `.merged_at` restores the `MERGED` the `case`
            # below expects; other states are upper-cased.
            gh api "repos/$repo/pulls?state=all&per_page=100" --paginate \
              --jq '.[] | "\(.head.ref)|#\(.number)|\(.created_at)|\(.updated_at)|\(if .merged_at then "MERGED" else (.state | ascii_upcase) end)|\(.title)"' 2>/dev/null \
              | sort -t'|' -k4 -r > "$pr_lookup_dir/$key.lookup" || true
          done

          # Last human feedback from ONE repo-wide REST comment feed on the core
          # bucket. Direct `gh api graphql` is denied by scripts/gh_cli_wrapper.py,
          # and one `gh issue view` per candidate is the N+1 that burned the quota
          # in bacluc-agent/agent-todo#292. The feed also carries PR comments, so a
          # PR whose number collides with a candidate issue can date-stamp it.
          # ponytail: newest 100 repo comments only; older human replies need a
          # `since` window — upgrade path: page until the oldest candidate is covered.
          human_ts_file="$RUNNER_TEMP/human-timestamps.txt"
          if ! gh api \
            "repos/${ISSUE_REPOSITORY}/issues/comments?sort=created&direction=desc&per_page=100" \
            --jq '.[] | select(.user.login != "bacluc-agent") | "\(.issue_url | split("/") | last)\t\(.created_at)"' \
            > "$human_ts_file"; then
            printf '::warning::human-feedback lookup failed; candidates fall back to none\n' >&2
            : > "$human_ts_file"
          fi
          printf 'Human feedback timestamps: %s human comment(s) from the newest 100 repo comments\n' "$(wc -l < "$human_ts_file")"

          # Shuffle candidates so enrichment order (and the debug dump) is random.
          while IFS= read -r num; do
            pr_info="none"
            pr_repo=""
            pr_number=""
            for repo in "${repo_list[@]}"; do
              key="$(echo "$repo" | tr '/' '_')"
              match="$(grep -m1 -E "issue-${num}([-_]|[^0-9A-Za-z_-]|$)|${ISSUE_REPOSITORY}#${num}([^0-9]|$)" "$pr_lookup_dir/$key.lookup" 2>/dev/null || true)"
              if [[ -n "$match" ]]; then
                pr_repo="$repo"
                pr_number="$(echo "$match" | cut -d'|' -f2 | tr -d '#')"
                pr_created="$(echo "$match" | cut -d'|' -f3)"
                pr_state="$(echo "$match" | cut -d'|' -f5)"
                pr_last_commit="$(gh api --paginate --slurp "repos/$pr_repo/pulls/$pr_number/commits" | jq -er --arg fallback "$pr_created" '([.[][] | .commit.committer.date] | max) // $fallback')"
                case "$pr_state" in
                  MERGED) pr_info="merged #${pr_number} last-commit:${pr_last_commit}" ;;
                  CLOSED) pr_info="closed #${pr_number} last-commit:${pr_last_commit}" ;;
                  *) pr_info="open #${pr_number} last-commit:${pr_last_commit}" ;;
                esac
                break
              fi
            done
            # Newest non-bot feedback on the matched PR. Formal reviews carry
            # submitted_at and also mirror inline review comments.
            pr_human_ts="none"
            if [[ -n "$pr_number" ]]; then
              pr_human_ts="$(gh pr view "$pr_number" -R "$pr_repo" --json comments,reviews --jq '[[.comments[] | select(.author.login != "bacluc-agent") | .createdAt], [.reviews[] | select(.author.login != "bacluc-agent") | .submittedAt]] | add | max // "none"' 2>/dev/null || echo "none")"
            fi
            # Issue-side feedback from the ONE repo-wide REST comment feed fetched above,
            # not one `gh issue view` per candidate (the N+1 from agent-todo#292).
            issue_human_ts="$(grep -E "^${num}[[:space:]]" "$human_ts_file" 2>/dev/null | head -n1 | cut -f2 || true)"
            if [[ -z "$issue_human_ts" || "$issue_human_ts" == "null" ]]; then
              issue_human_ts="none"
            fi
            jq -nc --arg num "$num" --arg pr "$pr_info" --arg a "$issue_human_ts" --arg b "$pr_human_ts" '{number:($num|tonumber),pr_info:$pr,last_human_comment_at:([$a,$b]|map(select(test("^[0-9]")))|max // null)}' >> "$RUNNER_TEMP/enrichment.jsonl"
          done < <(shuf "$candidates")
          jq -n --slurpfile issues "$enriched" --slurpfile enrichment "$RUNNER_TEMP/enrichment.jsonl" '$issues[0] | map(. as $issue | ($enrichment | map(select(.number == $issue.number)) | .[0]) as $e | if $e then . + {last_human_comment_at:$e.last_human_comment_at, pr_state:($e.pr_info|split(" ")[0]), pr_number:(if $e.pr_info == "none" then null else ($e.pr_info|split("#")[1]|split(" ")[0]|tonumber) end), pr_last_commit_at:(if $e.pr_info == "none" then null else ($e.pr_info|split("last-commit:")[1]) end)} else . end)' > "$RUNNER_TEMP/candidates.final.json"
          cp "$RUNNER_TEMP/candidates.final.json" "$enriched"

          prompt="$RUNNER_TEMP/selection-prompt.txt"
          printf '%s\n' "$tail_instruction" > "$RUNNER_TEMP/tail.txt"
          python3 scripts/selection_tiers.py --candidates "$enriched" --branches "$RUNNER_TEMP/branches.txt" --tail-file "$RUNNER_TEMP/tail.txt" > "$prompt"
          printf 'Selected-tier candidates:\n'
          cat "$prompt"

          selection="$RUNNER_TEMP/selection.out"
          set +e
          stop_token="$(openssl rand -hex 32)"
          : "${stop_token:?stop-commands fence token generation failed}"
          printf '::stop-commands::%s\n' "$stop_token"
          timeout "${SELECTION_TIMEOUT_MINUTES}m" opencode run --agent issue-selector --model "$selection_model" --title "issue-selector" "$(< "$prompt")" | tee "$selection"
          selection_statuses=("${PIPESTATUS[@]}")
          printf '::%s::\n' "$stop_token"
          selection_status=${selection_statuses[0]}
          selection_tee_status=${selection_statuses[1]}
          set -e
          printf 'Model selection statuses: opencode=%s tee=%s\n' "$selection_status" "$selection_tee_status"
          if (( selection_tee_status != 0 )); then
            exit "$selection_tee_status"
          fi
          if (( selection_status != 0 )); then
            printf 'Selection failed (opencode=%s); not dispatching.\n' "$selection_status" >&2
            if (( selection_status == 124 )); then
              printf '::error::issue selection exceeded the %sm limit (opencode exit %s); standing down this run.\n' "$SELECTION_TIMEOUT_MINUTES" "$selection_status"
              exit 0
            fi
            exit 1
          fi
          if ! grep -q '[^[:space:]]' "$selection"; then
            printf '%s\n' 'Selection produced no output; not dispatching.' >&2
            exit 1
          fi

          eof="EOF_PROMPT_$(openssl rand -hex 32)"
          if grep -Fqx -- "$eof" "$selection"; then
            printf '%s\n' 'Selection output contained the output delimiter; not dispatching.' >&2
            exit 1
          fi
          # `|| true` is required: under `set -Eeuo pipefail` a non-matching grep fails the whole
          # pipeline, and the assignment would abort the step before the dispatch happens.
          issue_number="$(grep -E '^SELECTED_ISSUE:[[:space:]]*[0-9]+[[:space:]]*$' "$selection" | tail -1 | grep -oE '[0-9]+' || true)"
          if [[ -z "$issue_number" ]] || ! grep -qxF "$issue_number" "$candidates"; then
            printf '::error::missing or invalid SELECTED_ISSUE; not dispatching\n'
            exit 1
          fi
          printf 'issue_number=%s\n' "$issue_number" >> "$GITHUB_OUTPUT"
          if ! gh issue edit "$issue_number" -R "$ISSUE_REPOSITORY" --add-label agent-running,agent-attempted; then
            printf '::warning::could not claim issue %s; dispatching unclaimed\n' "$issue_number"
          fi
          {
            printf 'prompt<<%s\n' "$eof"
            printf '%s\n' "$(< "$selection")"
            printf '%s\n' "$eof"
          } >> "$GITHUB_OUTPUT"

          stop_token="$(openssl rand -hex 32)"
          : "${stop_token:?stop-commands fence token generation failed}"
          printf '::stop-commands::%s\n' "$stop_token"
          printf '%s\n' 'Implementation prompt:'
          cat "$selection"
          printf '::%s::\n' "$stop_token"

      - name: Update cache on selection failure
        if: failure() && steps.pick.outputs.selection_model != '' && steps.model-availability.outputs.cache-issue != ''
        shell: bash
        env:
          MODEL: ${{ steps.pick.outputs.selection_model }}
          CACHE_ISSUE: ${{ steps.model-availability.outputs.cache-issue }}
          GITHUB_TOKEN: ${{ secrets.BACLUC_AGENT_GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          cache_json=$(gh issue view "$CACHE_ISSUE" -R "$ISSUE_REPOSITORY" --json body --jq '.body' 2>/dev/null || echo '{}')
          checked="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fatal_model=""
          fatal_reason=""
          if [[ -f "$RUNNER_TEMP/opencode-fatal.json" ]]; then
            fatal_model=$(jq -r '.model' "$RUNNER_TEMP/opencode-fatal.json")
            fatal_reason=$(jq -r '.reason' "$RUNNER_TEMP/opencode-fatal.json")
            fatal_message=$(jq -r '(.message // empty) | tostring | gsub("%"; "%25") | gsub("[\r\n]+"; " ")' "$RUNNER_TEMP/opencode-fatal.json")
            printf '::error::fatal provider error (%s) from model %s: %s\n' "$fatal_reason" "$fatal_model" "${fatal_message:-unknown}"
          fi
          fatal_provider="${fatal_model%/*}"
          MODEL="${fatal_model:-$MODEL}"
          if [[ "$fatal_reason" == balance || "$fatal_reason" == auth ]]; then
            new_cache=$(echo "$cache_json" | jq --arg provider "$fatal_provider" --arg checked "$checked" \
              'with_entries(if (.key | split("/")[0]) == $provider then .value = {"ok": false, "checked": $checked} else . end)')
          else
            new_cache=$(echo "$cache_json" | jq --arg model "$MODEL" --arg checked "$checked" \
              '. + {($model): {"ok": false, "checked": $checked}}')
          fi
          gh issue edit "$CACHE_ISSUE" -R "$ISSUE_REPOSITORY" --body "$new_cache" || true

      - name: Dump debug output
        if: always()
        shell: bash
        env:
          COORDINATOR_SESSION_TITLE: issue-selector
        run: |
          python3 scripts/dump_subagent_transcripts.py || true

  run:
    needs: select
    if: needs.select.outputs.prompt != ''
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/opencode.yml
    with:
      prompt: ${{ needs.select.outputs.prompt }}
      issue_number: ${{ needs.select.outputs.issue_number }}
    secrets: inherit

  release:
    needs: [select, run]
    if: always() && needs.select.outputs.issue_number != ''
    permissions:
      issues: write
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      GITHUB_TOKEN: ${{ secrets.BACLUC_AGENT_GITHUB_TOKEN }}
      ISSUE_REPOSITORY: ${{ vars.ISSUE_REPOSITORY || github.repository }}
    steps:
      - name: Release the issue claim
        shell: bash
        env:
          ISSUE_NUMBER: ${{ needs.select.outputs.issue_number }}
        run: |
          set -Eeuo pipefail
          printf '::add-mask::%s\n' "$GITHUB_TOKEN"
          if ! gh issue edit "$ISSUE_NUMBER" -R "$ISSUE_REPOSITORY" --remove-label agent-running; then
            printf '::warning::could not remove agent-running from #%s; it stays claimed until unlabelled by hand\n' "$ISSUE_NUMBER"
          fi
