name: Agent loops tests

on:
  push:
    paths:
      - "packages/agent-loops/**"
      - ".github/workflows/agent-loops.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-loops:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test agent loops
        run: node --experimental-strip-types --test packages/agent-loops/test/index.test.ts
