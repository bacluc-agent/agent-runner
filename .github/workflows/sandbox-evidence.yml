name: Sandbox evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up OpenCode and nono
        uses: ./.github/actions/setup-opencode
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify sandbox policy and OpenCode PONG
        shell: bash
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          GH_ENTERPRISE_TOKEN: ""
        run: |
          set -Eeuo pipefail

          curl -fsS https://api.github.com/rate_limit >/dev/null
          printf '%s\n' 'GitHub GET allowed'

          if nono run --profile "$NONO_PROFILE" --allow-cwd -- curl -sS -X POST \
            https://api.github.com/repos/octocat/Hello-World/issues \
            -H 'Content-Type: application/json' -d '{"title":"sandbox probe"}'; then
            printf '%s\n' 'Outsider mutation unexpectedly allowed' >&2
            exit 1
          fi
          printf '%s\n' 'Outsider mutation denied'

          status=$(nono run --profile "$NONO_PROFILE" --allow-cwd -- curl -sS -o /dev/null -w '%{http_code}' -X POST \
            https://api.github.com/repos/bacluc-agent/agent-runner/issues \
            -H 'Content-Type: application/json' -d '{"title":"sandbox probe"}')
          [[ "$status" == 401 ]] || { printf 'Owned mutation did not reach GitHub unauthenticated: HTTP %s\n' "$status" >&2; exit 1; }
          printf '%s\n' 'Owned mutation passed sandbox and was rejected by GitHub without credentials (HTTP 401)'

          output=$(nono run --profile "$NONO_PROFILE" --allow-cwd -- opencode run --model opencode/big-pickle 'Reply with exactly PONG and do nothing else.')
          printf '%s\n' "$output"
          [[ "$output" == *PONG* ]]
