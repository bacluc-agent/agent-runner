name: Formatter check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prettier-check:
    runs-on: ubuntu-latest
    container: ghcr.io/bacluc/prettier-image/prettier-image:5.1.1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check formatter files
        run: prettier --check pyproject.toml uv.lock
