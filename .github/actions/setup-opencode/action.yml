name: Set up OpenCode
description: >-
  Installs the OpenCode CLI and prepares the shared OpenCode configuration
  from the provision-machines repository. Relies on the job-level
  GITHUB_TOKEN set by the caller.
runs:
  using: composite
  steps:
    - name: Install OpenCode
      shell: bash
      run: npm install --global opencode-ai@1.18.30

    - name: Fetch and prepare OpenCode configuration
      id: config
      shell: bash
      env:
        SOURCE_REPOSITORY: https://github.com/bacluc/provision-machines.git
        CONFIG_PATH: deploys/development_tools/ai_agent_devcontainer/files/opencode
        SKILLS_PATH: deploys/development_tools/ai_agent_devcontainer/files/claude/skills
      run: |
        set -Eeuo pipefail

        printf '::add-mask::%s\n' "$GITHUB_TOKEN"
        printf '::add-mask::%s\n' "${OPENCODE_GO_API_KEY:-}"
        printf '::add-mask::%s\n' "${OPENCODE_GO_2_API_KEY:-}"
        source_dir="$RUNNER_TEMP/provision-machines"
        config_dir="$RUNNER_TEMP/opencode-config"
        # Using branch issue-238-build-concise from provision-machines for PR #192 review
        branch_ref="issue-238-build-concise"
        git clone --quiet --branch "$branch_ref" "$SOURCE_REPOSITORY" "$source_dir"
        printf 'Using source branch: %s (commit %s)\n' "$branch_ref" "$(git -C "$source_dir" rev-parse HEAD)"
        if [[ ! -d "$source_dir/$CONFIG_PATH" ]]; then
          printf 'Missing OpenCode configuration directory: %s\n' "$CONFIG_PATH" >&2
          exit 1
        fi
        rm -rf "$config_dir"
        cp -a "$source_dir/$CONFIG_PATH" "$config_dir"
        printf 'agents/build.md: %s\n' "$(sed -n 's/^description: *//p' "$config_dir/agents/build.md" | head -n1)" || true
        printf 'build.md lines: %s\n' "$(wc -l < "$config_dir/agents/build.md")"
        grep -nF 'Implement only the supplied plan or simple-task guidance' "$config_dir/agents/build.md"

        if [[ ! -d "$source_dir/$SKILLS_PATH" ]]; then
          printf 'Missing skills directory: %s\n' "$SKILLS_PATH" >&2
          exit 1
        fi
        if [[ -z "$(compgen -G "$source_dir/$SKILLS_PATH/*/SKILL.md" 2>/dev/null)" ]]; then
          printf 'No SKILL.md files found in skills directory: %s\n' "$SKILLS_PATH" >&2
          exit 1
        fi
        cp -a "$source_dir/$SKILLS_PATH" "$config_dir/skills"
        printf 'Copied skills: %s\n' "$(ls "$config_dir/skills" | tr '\n' ' ')"

        [[ -f "$config_dir/agents/model-discovery.md" ]] || { echo "Missing model-discovery agent file"; exit 1; }

        mkdir -p "$HOME/.config"
        rm -rf "$HOME/.config/opencode"
        cp -a "$config_dir" "$HOME/.config/opencode"

    - name: Materialize OpenCode auth
      shell: bash
      run: |
        set -Eeuo pipefail
        umask 077
        if [[ -n "${OPENCODE_AUTH_CONTENT:-}" ]]; then
          printf '::add-mask::%s\n' "$OPENCODE_AUTH_CONTENT"
          printf '%s' "$OPENCODE_AUTH_CONTENT" | while IFS= read -r line || [[ -n "$line" ]]; do [[ -n "$line" ]] && printf '::add-mask::%s\n' "$line"; done
          mkdir -p ~/.local/share/opencode
          printf '%s' "$OPENCODE_AUTH_CONTENT" > ~/.local/share/opencode/auth.json
          if ! jq -e '.openai.type == "oauth" and .openai.access != "" and .openai.refresh != "" and (.openai.expires | type == "number")' ~/.local/share/opencode/auth.json >/dev/null 2>&1; then
            echo "::warning::OPENCODE_AUTH_CONTENT is not valid opencode auth JSON (expected {openai:{type:oauth,access,refresh,expires:number}}); removing auth.json and continuing without it" >&2
            rm -f ~/.local/share/opencode/auth.json
          elif command -v opencode >/dev/null 2>&1 && ! opencode --help >/dev/null 2>&1; then
            echo "::warning::opencode config check failed with provided auth.json; removing auth.json and continuing" >&2
            rm -f ~/.local/share/opencode/auth.json
          fi
        fi
