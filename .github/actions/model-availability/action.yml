name: Check model availability
description: >-
  Probes whitelisted models (free models plus glm, gpt-5.6-luna, qwen, kimi,
  big-pickle) of the OpenCode Go providers and OpenRouter for availability
  and merges the results into the model-availability cache issue in the issue
  repository. The cache issue number is taken from the
  MODEL_AVAILABILITY_CACHE_ISSUE env var, or auto-detected by searching for
  an issue titled "model-discovery cache" in the repository set via
  ISSUE_REPOSITORY. Available models cache for 24 hours, failed models
  for 24 hours. Probes at most 30 stale candidates per run, highest
  priority first. Relies on the job-level OPENCODE_GO_API_KEY,
  OPENCODE_GO_2_API_KEY and OPENROUTER_API_KEY env vars set by the caller.
outputs:
  cache-issue:
    description: Resolved model-availability cache issue number (empty when none)
    value: ${{ steps.check.outputs.cache-issue }}
  cache-json:
    description: Merged cache JSON (current cache plus fresh probe results)
    value: ${{ steps.check.outputs.cache-json }}
  available-models:
    description: >-
      Newline-separated model IDs with ok=true in the merged cache, free
      models first, then paid models
    value: ${{ steps.check.outputs.available-models }}
runs:
  using: composite
  steps:
    - name: Check model availability
      id: check
      shell: bash
      run: |
        set -Eeuo pipefail
        umask 077
        printf '::add-mask::%s\n' "${OPENCODE_GO_API_KEY:-}"
        printf '::add-mask::%s\n' "${OPENCODE_GO_2_API_KEY:-}"
        printf '::add-mask::%s\n' "${OPENROUTER_API_KEY:-}"
        printf '::add-mask::%s\n' "${OPENCODE_AUTH_CONTENT:-}"
        printf '%s' "${OPENCODE_AUTH_CONTENT:-}" | while IFS= read -r line || [[ -n "$line" ]]; do [[ -n "$line" ]] && printf '::add-mask::%s\n' "$line"; done
        if [[ -n "${OPENCODE_AUTH_CONTENT:-}" ]]; then
          mkdir -p ~/.local/share/opencode
          printf '%s' "$OPENCODE_AUTH_CONTENT" > ~/.local/share/opencode/auth.json
          if ! jq -e '.openai.type == "oauth" and .openai.access != "" and .openai.refresh != "" and (.openai.expires | type == "number")' ~/.local/share/opencode/auth.json >/dev/null 2>&1; then
            echo "::warning::OPENCODE_AUTH_CONTENT is not valid opencode auth JSON (expected {openai:{type:oauth,access,refresh,expires:number}}); removing auth.json and continuing without it" >&2
            rm -f ~/.local/share/opencode/auth.json
          elif command -v opencode >/dev/null 2>&1 && ! opencode --help >/dev/null 2>&1; then
            echo "::warning::opencode config check failed with provided auth.json; removing auth.json and continuing" >&2
            rm -f ~/.local/share/opencode/auth.json
          fi
        fi
        python3 "${{ github.action_path }}/model_availability.py"
